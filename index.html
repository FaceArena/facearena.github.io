<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FACE ARENA">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<title>FACE ARENA — Кто красивее?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700&display=block">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700&display=block" rel="stylesheet">
<style>
:root{--bg:#050505;--s:#101010;--c:#151515;--tx:#fff;--mu:#8c8c8c;--red:#FF3434;--blue:#3478FF;
--hd:'Unbounded','Arial Black',system-ui,sans-serif;--bd:'Manrope',system-ui,-apple-system,sans-serif;
color-scheme:dark;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
/* Keep content visible while web fonts load; avoid full-page opacity flash */
html,body{opacity:1}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:400 14px/1.45 var(--bd);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#appScroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:1180px;margin:0 auto;padding:0 12px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px;gap:10px}
.logo{font:800 clamp(12px,3.6vw,14px) var(--hd);letter-spacing:.1em;display:flex;align-items:center;gap:2px;min-width:0;white-space:nowrap;flex-shrink:1}
.fa-brand-logo-image{display:block;width:34px;height:34px;flex:none;object-fit:contain;border-radius:5px}
.logo{gap:7px}
.hdr-right{display:flex;align-items:center;gap:12px;flex-shrink:0;height:36px}
.btn-gear,.btn-notifications{position:relative;width:36px;height:36px;min-width:36px;border:0;border-radius:50%;background:transparent;color:var(--mu);display:grid;place-items:center;cursor:pointer;padding:0;flex-shrink:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn-notifications:active,.btn-gear:active{color:#fff;background:var(--s)}
.btn-notifications svg{width:19px;height:19px;display:block}
.btn-gear svg{width:20px;height:20px;display:block}
@media(max-width:420px){
  header{gap:8px}
  .hdr-right{gap:8px}
  .logo{letter-spacing:.075em;gap:2px}
  .fa-brand-logo-image{width:32px;height:32px}
  .live{font-size:10px;letter-spacing:.09em;gap:5px}
  .btn-gear,.btn-notifications{width:32px;height:32px;min-width:32px}
  .btn-notifications svg{width:18px;height:18px}
  .btn-gear svg{width:19px;height:19px}
}
.btn-notifications:active{color:#fff;background:var(--s)}
.btn-notifications svg{width:17px;height:17px;display:block}
.notification-count{position:absolute;right:-3px;top:-2px;min-width:15px;height:15px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font:800 9px/15px var(--bd);text-align:center}
.notification-list{display:grid;gap:8px;margin-top:12px}
.notification-item{width:100%;text-align:left;border:0;border-radius:13px;background:var(--c);padding:13px 14px;color:#fff;display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;cursor:pointer}
.notification-item.unread{background:#171717}
.notification-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);margin-top:5px}
.notification-item.read .notification-dot{background:#444}
.notification-item strong{display:block;font-size:13px;line-height:1.35}
.notification-item p{margin:4px 0 0;color:#b8b8b8;font-size:12px;line-height:1.4}
.notification-item time{display:block;margin-top:7px;color:var(--mu);font-size:10px}
.btn-gear:active{color:#fff;background:var(--s)}
.btn-gear svg{width:16px;height:16px;display:block}
.live{font:600 11px var(--bd);letter-spacing:.14em;text-transform:uppercase;color:var(--mu);display:flex;align-items:center;gap:6px;height:28px;line-height:1}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
h1{font:800 clamp(28px,8.5vw,72px)/.95 var(--hd);letter-spacing:-.02em;margin:16px 0 10px;text-transform:uppercase}
.lead{color:var(--mu);max-width:520px;margin:0 0 16px;font-size:14px;line-height:1.45}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--s);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:800 18px var(--hd)}
.stat span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);contain:content}
@media(min-width:640px){.grid{gap:16px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--c);border-radius:16px;padding:10px;cursor:pointer;opacity:1;animation:none;transition:transform .18s cubic-bezier(.2,.7,.2,1);-webkit-tap-highlight-color:transparent;touch-action:manipulation;will-change:auto;contain:layout style}
@keyframes in{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
.card:hover{transform:translateY(-2px)}.card:active{transform:scale(.97)}
.card:focus-visible{outline:2px solid #fff;outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.num{font:800 11px var(--hd);letter-spacing:.1em}
.chip{font:700 9px var(--bd);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:var(--s);color:var(--mu)}
.chip.v{color:#fff}.chip.v::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);margin-right:5px;animation:pulse 1.6s infinite}
.duel{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:12px;overflow:hidden}
.ph{position:relative;aspect-ratio:3/4;background:var(--s);overflow:hidden;box-sizing:border-box}
.ph.R{
  background:radial-gradient(ellipse 80% 70% at 50% 45%,#5a1818 0%,#2a0808 55%,#120404 100%);
  box-shadow:inset 0 0 0 3px var(--red);
}
.ph.B{
  background:radial-gradient(ellipse 80% 70% at 50% 45%,#183a7a 0%,#081830 55%,#040812 100%);
  box-shadow:inset 0 0 0 3px var(--blue);
}
.ph img{
  width:100%;height:100%;object-fit:cover;object-position:center top;display:block;
  transition:transform .25s ease-out;
  /* soft vignette so subject sits on colored studio back */
  -webkit-mask-image:radial-gradient(ellipse 92% 88% at 50% 42%,#000 55%,transparent 100%);
  mask-image:radial-gradient(ellipse 92% 88% at 50% 42%,#000 55%,transparent 100%);
}
.ph.R img{mix-blend-mode:normal}
.ph.B img{mix-blend-mode:normal}
.card:hover .ph img{transform:scale(1.04)}
.side{position:absolute;left:6px;top:6px;font:800 10px var(--hd);letter-spacing:.08em;padding:3px 6px;border-radius:5px;color:#fff;z-index:1}
.R .side{background:var(--red)}.B .side{background:var(--blue)}
.nm{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.88));font-weight:700;font-size:10px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:0;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:800 11px var(--hd);box-shadow:0 0 0 2px var(--bg);transform:translate(-50%,-50%);z-index:2}
.bar{position:relative;height:5px;border-radius:99px;background:var(--blue);overflow:hidden;margin:10px 0 6px}
.bar u{position:absolute;inset:0;background:var(--red);transform-origin:left;transform:scaleX(0);transition:transform .6s ease-out;text-decoration:none}
.bar.zero{background:#262626}.bar.zero u{display:none}
.pct{display:flex;justify-content:space-between;align-items:center;font:700 10px var(--bd);gap:4px}
.pct .r{color:var(--red);flex-shrink:0}.pct .b{color:var(--blue);flex-shrink:0}.pct .m{color:var(--mu);font-weight:600;text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{margin-top:8px;padding-top:8px;border-top:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.tm small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.tm b{font:800 16px var(--hd);font-variant-numeric:tabular-nums}
.tl{height:2px;background:#222;margin-top:6px;overflow:hidden;border-radius:2px}
.tl u{display:block;height:100%;background:#fff;transform-origin:left;transition:transform 1s linear;text-decoration:none}
nav{position:relative;flex:0 0 auto;left:auto;right:auto;bottom:auto;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:#0a0a0a;backdrop-filter:none;-webkit-backdrop-filter:none;z-index:5}
.tabs{position:relative;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;color:var(--mu);font:700 9px var(--bd);letter-spacing:.08em;text-transform:uppercase;padding:6px 0 4px;display:grid;grid-template-rows:22px 14px;align-content:center;justify-items:center;gap:6px;min-height:58px;box-sizing:border-box;cursor:pointer;transition:color .22s;touch-action:manipulation}
.tabs button.on{color:#fff}
.tabs button svg{width:18px;height:18px;display:block;align-self:center;justify-self:center;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button:not(svg){text-align:center;white-space:nowrap}
.ind{position:absolute;top:0;left:0;width:25%;height:2px;display:flex;justify-content:center;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.ind::after{content:"";width:28px;height:2px;background:linear-gradient(90deg,var(--red),var(--blue))}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:#fff;color:#000;font-weight:700;font-size:12px;padding:9px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:6;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.back{background:none;border:0;color:var(--mu);font:700 12px var(--bd);letter-spacing:.1em;text-transform:uppercase;padding:14px 0 8px;min-height:44px;cursor:pointer;touch-action:manipulation}
.view,#av{pointer-events:none}
.view.is-on,#av.is-on{pointer-events:auto;animation:viewIn .12s ease-out}
@keyframes viewIn{from{opacity:0}to{opacity:1}}
html.no-anim .view,html.no-anim #av{animation:none!important}
@media (prefers-reduced-motion:reduce){.view.is-on,#av.is-on{animation:none}}
@keyframes fadeUp{from{opacity:0;transform:translate3d(0,6px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes fadeScale{from{opacity:0;transform:scale3d(.98,.98,1)}to{opacity:1;transform:scale3d(1,1,1)}}
.card{animation-name:fadeUp}
.top-item{opacity:0;animation:fadeUp .18s ease-out forwards;animation-delay:calc(min(var(--i,0),4)*18ms)}
.match-card{animation:fadeScale .18s ease-out}
.q-item{opacity:0;animation:fadeUp .18s ease-out forwards;animation-delay:calc(min(var(--i,0),5)*16ms)}
.settings-block{opacity:0;animation:fadeUp .18s ease-out forwards;animation-delay:calc(min(var(--i,0),3)*16ms)}
.pr-head,.pr-stats{opacity:0;animation:fadeUp .18s ease-out forwards}
.pr-head{animation-delay:12ms}.pr-stats{animation-delay:24ms}
html.no-anim .view,html.no-anim #av{animation:none!important}
html.no-anim .top-item,html.no-anim .q-item,html.no-anim .settings-block,html.no-anim .pr-head,html.no-anim .pr-stats,html.no-anim .match-card{animation:none!important;opacity:1!important}
.big{max-width:640px;margin:0 auto}
.big .duel{border-radius:16px;gap:3px}
.big .ph{aspect-ratio:3/4}
.big .nm{font-size:15px;padding:28px 12px 10px}
.big .vs{width:48px;height:48px;margin:0;font-size:14px;box-shadow:0 0 0 3px var(--bg);transform:translate(-50%,-50%)}
.big .bar{height:7px;margin-top:14px}
.big .side{left:8px;top:8px;font-size:11px;padding:4px 8px}
.B .side{left:auto;right:6px}
.big .B .side{left:auto;right:8px}
.big .pct{font-size:13px}
.big .tm b{font-size:22px}
.big .tm small{font-size:11px}
.note{color:var(--mu);font-size:12px;margin:10px 0 0;line-height:1.4}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 8px}
.pick{border:0;border-radius:14px;padding:16px 8px;min-height:52px;color:#fff;font:800 12px var(--hd);letter-spacing:.06em;cursor:pointer;transition:transform .18s cubic-bezier(.2,.7,.2,1);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pick:active{transform:scale(.96)}.pick.R{background:var(--red)}.pick.B{background:var(--blue)}
h2{font:800 15px var(--hd);letter-spacing:.08em;text-transform:uppercase;margin:24px 0 10px}
.cms{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cm{background:var(--c);border-radius:12px;padding:11px 12px;border-left:3px solid;animation:in .45s both;animation-delay:calc(var(--i)*60ms)}
.cm.R{border-color:var(--red)}.cm.B{border-color:var(--blue)}
.cm b{font-size:13px}.cm .tg{font:800 10px var(--hd);margin-left:8px;letter-spacing:.1em}
.cm.R .tg{color:var(--red)}.cm.B .tg{color:var(--blue)}.cm p{margin:4px 0 0;color:#cfcfcf;font-size:13px;line-height:1.35}
.empty{background:var(--c);border-radius:12px;padding:20px;text-align:center;color:var(--mu);font-size:13px}
.big .nm{display:flex;align-items:center;gap:8px}
.av{width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none;position:relative;background:var(--s)}
.av img{width:100%;height:100%;object-fit:cover;transform:scale(2.4);transform-origin:50% 42%}
.nk{background:none;border:0;color:#fff;font:700 14px var(--bd);padding:4px 0;min-height:40px;cursor:pointer;transition:opacity .2s;touch-action:manipulation}.nk:hover{opacity:.7}.nk[data-profile-user]{text-decoration:underline;text-decoration-color:#ffffff55;text-underline-offset:4px}.public-profile-photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.public-profile-photos .ph-card{aspect-ratio:1;overflow:hidden;border-radius:13px;background:#111}.public-profile-photos img{width:100%;height:100%;object-fit:cover;background:var(--s);display:block}.profile-loading{padding:28px 12px;text-align:center;color:var(--mu)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);opacity:0;pointer-events:none;transition:opacity .28s;z-index:10}
.ov.on{opacity:1;pointer-events:auto}
.sh{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--s);border-radius:20px 20px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.7,.2,1)}
.ov.on .sh{transform:none}
.sh h3{font:800 15px var(--hd);letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
textarea{width:100%;background:var(--c);color:#fff;border:0;border-radius:12px;padding:12px;font:400 16px/1.4 var(--bd);resize:none;margin-top:10px}
textarea:focus{outline:2px solid #fff}
.row{display:flex;justify-content:space-between;gap:10px;margin:6px 0 12px;min-height:18px}
.err{color:#ffb454;font-size:12px;font-weight:600;text-align:right}
.send,.cancel{width:100%;border:0;border-radius:12px;min-height:50px;font:800 13px var(--hd);letter-spacing:.06em;color:#fff;cursor:pointer;touch-action:manipulation}
.send:disabled{opacity:.55}.cancel{background:none;color:var(--mu);margin-top:4px;font-family:var(--bd);font-weight:700}
.done{background:var(--c);border-radius:12px;padding:12px;margin:16px 0 8px;font-weight:600;font-size:14px}

/* Not-found view — match the site's black palette and typography */
.not-found{min-height:100%;display:flex;align-items:center;justify-content:center;padding:40px 18px;text-align:center}
.not-found-inner{width:100%;max-width:520px}
.not-found-mark{display:flex;align-items:center;justify-content:center;gap:9px;font:800 12px var(--hd);letter-spacing:.16em;color:#fff;margin-bottom:42px}
.not-found-mark i{display:flex;gap:4px}
.not-found-mark i b{width:8px;height:17px;display:block}
.not-found-mark i b:first-child{background:var(--red);transform:skewX(-14deg)}
.not-found-mark i b:last-child{background:var(--blue);transform:skewX(-14deg)}
.not-found-code{font:800 clamp(76px,22vw,132px)/.9 var(--hd);letter-spacing:-.08em;margin:0;background:linear-gradient(105deg,#fff 15%,#777 48%,#3478ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.not-found-title{font:800 clamp(17px,4.5vw,23px)/1.25 var(--hd);letter-spacing:.015em;text-transform:uppercase;margin:22px 0 10px}
.not-found-copy{color:var(--mu);font:400 14px/1.6 var(--bd);margin:0 auto;max-width:340px}
.not-found-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:28px auto 0;max-width:380px}
.not-found-actions a,.not-found-actions button{min-height:48px;border-radius:12px;padding:12px 10px;font:800 11px var(--hd);letter-spacing:.04em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.not-found-home{background:#fff;color:#050505;border:1px solid #fff}
.not-found-back{background:#111;color:#fff;border:1px solid #292929}
.not-found-actions a:focus-visible,.not-found-actions button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.card{opacity:1}}
html.no-anim *,html.no-anim *::before,html.no-anim *::after{animation:none!important;transition:none!important}
html.no-anim .card{opacity:1}
/* Settings — full-screen menu style */
#sv.settings-menu{padding-bottom:24px;min-height:100%}
.settings-menu-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.settings-menu-list li{margin:0}
.settings-menu-list a,.settings-menu-list button.menu-item{
  display:block;width:100%;text-align:left;background:none;border:0;
  color:#ececec;font:400 18px/1.3 var(--bd);
  padding:20px 6px;cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;transition:color .15s,opacity .15s;
}
.settings-menu-list a:active,.settings-menu-list button.menu-item:active{opacity:.55}
.settings-menu-list .menu-item.danger{color:#ff6b6b}
.settings-menu-sep{height:1px;background:#222;margin:18px 0 10px}
.settings-menu-foot{margin-top:28px;padding-top:8px;text-align:center}
.settings-menu-foot .menu-exit{
  background:none;border:0;color:#cfcfcf;font:400 16px var(--bd);
  padding:16px 12px;cursor:pointer;touch-action:manipulation;
}
.settings-menu-foot .menu-exit:active{opacity:.55}
.settings-sub{display:none}
.settings-sub.on{display:block}
.settings-sub .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid #222;min-height:52px}
.settings-sub .set-row:first-of-type{border-top:0;padding-top:4px}
.settings-sub .lbl{font-size:15px;font-weight:600}
.settings-sub .sub{font-size:12px;color:var(--mu);margin-top:3px}
.settings-sub input[type=text]{width:100%;max-width:180px;background:var(--s);border:0;border-radius:10px;padding:11px 12px;color:#fff;font:600 14px var(--bd)}
.settings-sub input:focus{outline:2px solid #fff}
.set-toggle{position:relative;width:48px;height:28px;border-radius:99px;background:#333;border:0;cursor:pointer;flex-shrink:0;touch-action:manipulation}
.set-toggle.on{background:var(--blue)}
.set-toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.set-toggle.on::after{transform:translateX(20px)}
.btn-danger{width:100%;border:0;border-radius:14px;min-height:52px;font:800 13px var(--hd);letter-spacing:.06em;color:#fff;background:#5a1010;cursor:pointer;touch-action:manipulation;margin-top:8px}
.btn-main{width:100%;border:0;border-radius:14px;min-height:52px;font:800 13px var(--hd);letter-spacing:.06em;color:#fff;background:var(--blue);cursor:pointer;touch-action:manipulation;margin-top:12px}
.set-info{font-size:13px;color:var(--mu);line-height:1.5;margin:0 0 12px}

function newBattleUid(){return "b_"+Date.now().toString(36)+"_"+((++_uidSeq)%1e6).toString(36)+"_"+Math.random().toString(36).slice(2,7)}

function saveState(){
  // Authenticated arena state is server-owned; never persist it under a shared browser key.
  if(window.FaceArenaSync)return;
  try{
    const data={
      v:3,
      photos, history, profile, prefAnim, _uidSeq, participantStats,
      arenaBattles:arenaBattles.map(b=>({...b})),
      voted:[...VOTED],
      my:MY,
      savedAt:Date.now()
    };
    localStorage.setItem(LS_KEY,JSON.stringify(data));
  }catch(e){
    toast("Не удалось сохранить: память браузера переполнена или недоступна");
  }
}
function loadState(){
  // Wait for Supabase; do not restore legacy unscoped demo data before account identity is known.
  if(window.FaceArenaSync)return false;
  try{
    // migrate from v1 if needed
    let raw=localStorage.getItem(LS_KEY);
    if(!raw)return false;
    const data=JSON.parse(raw);
    if(!data||!Array.isArray(data.photos)||!Array.isArray(data.arenaBattles))return false;
    photos=window.FaceArenaGameEngine?window.FaceArenaGameEngine.normalizeQueue(data.photos||[]):(data.photos||[]);
    history=data.history||[];
    arenaBattles=(data.arenaBattles||[]).map(b=>{
      b={...b};
      if(b.stage==="w"||b.stage==="v"){
        const oldDuration=STAGE_SEC*1000;
        const started=typeof b.stageStarted==="number"&&b.stageStarted>0?b.stageStarted:(typeof b.stageEnd==="number"&&b.stageEnd>1e12?b.stageEnd-oldDuration:Date.now());
        b.stageStarted=started;
        b.stageEnd=Math.min(typeof b.stageEnd==="number"&&b.stageEnd>1e12?b.stageEnd:started+oldDuration,started+STAGE_SEC*1000);
        b.totalStage=STAGE_SEC;
      }
      return b;
    });
    VOTED=new Set(data.voted||[]);
    MY=data.my||{};
    profile=data.profile||{name:"Вы",handle:"user"};
    if(localStorage.getItem(ANIM_PREF_KEY)===null)prefAnim=data.prefAnim!==false;
    _uidSeq=data._uidSeq||0;
    participantStats=data.participantStats||{};
    // Ensure every active battle has a battleUid
    arenaBattles.forEach(b=>{
      if((b.stage==="w"||b.stage==="v")&&!b.battleUid){
        b.battleUid=newBattleUid();
      }
    });
    applyAnimPref();
    return true;
  }catch(e){return false}
}

}

}

(function initArena(){
  if(!loadState())arenaBattles=createDefaultArena();

  photos=photos.filter(p=>!isDemoId(p.id)&&!p.isDemo&&!p.demoOnly);
  history=history.filter(h=>!isDemoId(h.photoId));
  Object.keys(participantStats).forEach(id=>{if(isDemoId(id)||participantStats[id]?.isDemo||participantStats[id]?.demoOnly)delete participantStats[id]});
  const byId=id=>photos.find(p=>String(p.id)===String(id));
  arenaBattles=arenaBattles.map((b,i)=>{

        ...r,name:r.name||profile.name||"Вы",img:r.img||face(1,"R")

function ensureStats(photoId, name, img){
  const k=String(photoId);
  if(!participantStats[k]) participantStats[k]={wins:0,losses:0,defenses:0,bestStreak:0,currentStreak:0,name:name||"Участник",img:img||"",isChampion:false,laneId:null};
  return participantStats[k];
}
function cancelInactiveBattle(b,now){
  if(window.FaceArenaGameEngine){
    const cancelled=window.FaceArenaGameEngine.cancelBattle({photos,lanes:arenaBattles,history,participantStats},b.id,now);
    if(!cancelled.changed)return false;
    photos=cancelled.state.photos;
    arenaBattles=cancelled.state.lanes;
    history=cancelled.state.history;
    participantStats=cancelled.state.participantStats;
    return true;
  }
  // Defensive fallback for a missing engine script: never leave a dead lane occupied.
  const p=b.userPhotoId?photos.find(x=>String(x.id)===String(b.userPhotoId)):null;
  if(p){
    p.status="queued";p.battleId=null;p.battleUid=null;p.targetLaneId=null;
    p.matchedAt=null;p.matchDeadline=null;p.completedAt=null;
    p.side=null;p.opponentName=null;p.opponentImg=null;
  }
  b.userPhotoId=null;b.stage="done";b._finalized=true;
  b.redVotes=0;b.blueVotes=0;
  return true;
}
function finishBattle(b,now){
  if(b.stage!=="w"&&b.stage!=="v")return false;
  if(b._finalized)return false;
  if(b.stage==="w"){
    if(!cancelInactiveBattle(b,now))return false;
    // The participant returns to FIFO; tickArena() immediately refills released lanes.
    return true;
  }
  const tot=b.redVotes+b.blueVotes;
  if(tot===0){
    if(!cancelInactiveBattle(b,now))return false;
    // The participant returns to FIFO; tickArena() immediately refills released lanes.
    return true;
  }
  b.stage="done";b._finalized=true;
  // Determine winning side
  let winSide="draw";
  if(b.redVotes>b.blueVotes)winSide="R";
  else if(b.blueVotes>b.redVotes)winSide="B";

  const p=b.userPhotoId?photos.find(x=>String(x.id)===String(b.userPhotoId)):null;
  if(p&&p.status==="voting"&&window.FaceArenaGameEngine){
    if(!p.name)p.name=profile.name||"Вы";
    const wasChampion=String(b.championPhotoId||"")===String(p.id);
    const resolved=window.FaceArenaGameEngine.resolveBattle({photos,lanes:arenaBattles,history,participantStats},b.id,now);
    if(!resolved.changed)return false;
    photos=resolved.state.photos;arenaBattles=resolved.state.lanes;history=resolved.state.history;participantStats=resolved.state.participantStats;
    if(resolved.result.outcome==="win")window.FaceArenaAudio?.play(wasChampion?"victory":"champion");
    else if(resolved.result.outcome==="lose")window.FaceArenaAudio?.play(wasChampion?"titleLost":"defeat");
    return true;
  }
  if(p&&(p.status==="voting"||p.status==="confirmed"||p.status==="champion")){
    const myV=p.side==="R"?b.redVotes:b.blueVotes, oppV=p.side==="R"?b.blueVotes:b.redVotes;
    let res="draw";if(myV>oppV)res="win";else if(myV<oppV)res="lose";
    const wasChampion=String(b.championPhotoId||"")===String(p.id);
    const st=ensureStats(p.id, profile.name||"Вы", p.dataUrl);
    if(res==="win"){
      window.FaceArenaAudio?.play(wasChampion?"victory":"champion");
      st.wins++;st.currentStreak=(st.currentStreak||0)+1;st.bestStreak=Math.max(st.bestStreak||0,st.currentStreak);
      // User becomes/stays champion of this lane
      if(b.championPhotoId&&String(b.championPhotoId)===String(p.id)){
        st.defenses=(st.defenses||0)+1;
        b.championStreak=(b.championStreak||0)+1;
      } else {
        // Challenger takes the title; archive the former user champion exactly once.
        if(b.championPhotoId!=null){
          const former=photos.find(x=>String(x.id)===String(b.championPhotoId));
          if(former&&String(former.id)!==String(p.id)&&former.status==="champion"){
            former.status="completed";former.result="lose";former.completedAt=now;former.battleId=null;
            former.myVotes=oppV;former.oppVotes=myV;
            const formerStats=ensureStats(former.id,profile.name||"Вы",former.dataUrl);
            formerStats.losses=(formerStats.losses||0)+1;formerStats.currentStreak=0;formerStats.isChampion=false;formerStats.laneId=null;
            if(!history.some(h=>String(h.battleUid)===String(b.battleUid)&&String(h.photoId)===String(former.id))){
              history.unshift({photoId:former.id,battleId:b.id,battleUid:b.battleUid,laneId:b.id,side:former.side,result:"lose",myVotes:oppV,oppVotes:myV,opponentName:profile.name||"Вы",opponentImg:p.dataUrl,completedAt:now,myImg:former.dataUrl,championAfter:false});
            }
          }
        }
        b.championPhotoId=p.id;
        b.championSide=p.side;
        b.championStreak=1;
        b.championName=profile.name||"Вы";
        b.championImg=p.dataUrl;
      }
      st.isChampion=true;st.laneId=b.id;
      p.status="champion"; // still active, holds title
      p.battleId=b.id;p.result=res;p.myVotes=myV;p.oppVotes=oppV;
      p.completedAt=null;
      // Opponent mock loses — no photo record
    } else if(res==="lose"){
      window.FaceArenaAudio?.play(wasChampion?"titleLost":"defeat");
      st.losses++;st.currentStreak=0;st.isChampion=false;st.laneId=null;
      p.status="completed";p.result=res;p.myVotes=myV;p.oppVotes=oppV;p.completedAt=now;p.battleId=null;
      // Title goes to mock opponent side — clear user championship on lane, keep lane open for next
      if(b.championPhotoId&&String(b.championPhotoId)===String(p.id)){
        b.championPhotoId=null;b.championSide=null;b.championStreak=0;b.championName=null;b.championImg=null;
      } else {
        // user was challenger and lost — existing champion (mock) remains; no user champ
      }
    } else {
      // draw — no title change; user photo completes without streak
      p.status="completed";p.result=res;p.myVotes=myV;p.oppVotes=oppV;p.completedAt=now;p.battleId=null;
    }
    history.unshift({photoId:p.id,battleId:b.id,battleUid:b.battleUid,laneId:b.id,side:p.side,result:res,myVotes:myV,oppVotes:oppV,opponentName:p.opponentName,opponentImg:p.opponentImg,completedAt:now,myImg:p.dataUrl,championAfter:p.status==="champion"});
  } else if(winSide!=="draw"&&b.championPhotoId){
    // Mock battle with real champion defending vs mock — rare path
    const st=ensureStats(b.championPhotoId,b.championName,b.championImg);
    if((winSide==="R"&&b.championSide==="R")||(winSide==="B"&&b.championSide==="B")){
      st.wins++;st.defenses++;st.currentStreak++;st.bestStreak=Math.max(st.bestStreak,st.currentStreak);
      b.championStreak=(b.championStreak||0)+1;
    }
  }
  // Clear active battle link for next challenger assignment but keep champion on lane
  b.userPhotoId=null;
  b.redVotes=0;b.blueVotes=0;
  return true;
}
function tryFillSlots(){
  if(window.FaceArenaSync?.isOnline())return;
  const now=Date.now();
  const waitingMatched=photos.filter(p=>p.status==="matched"&&p.matchDeadline&&p.matchDeadline<=now&&!p._confirming);
  waitingMatched.forEach(p=>confirmMatch(p));
  if(!window.FaceArenaGameEngine)return;
  let guard=0;
  while(guard++<MAX_BATTLES){
    const assignment=window.FaceArenaGameEngine.selectNextAssignment(photos,arenaBattles);
    if(!assignment)break;
    const p=photos.find(x=>String(x.id)===String(assignment.photoId));
    const lane=arenaBattles.find(x=>String(x.id)===String(assignment.laneId));
    if(!p||!lane)break;
    p.status="matched";p.targetLaneId=lane.id;p.matchedAt=now;p.matchDeadline=now+MATCH_SEC*1000;
    if(assignment.opening){
      const opponent=photos.find(x=>String(x.id)===String(assignment.opponentPhotoId));
      if(!opponent||opponent.status!=="queued"||(opponent.userId||opponent.ownerId||"__local_user__")===(p.userId||p.ownerId||"__local_user__")){
        p.status="queued";p.targetLaneId=null;p.matchedAt=null;p.matchDeadline=null;break;
      }
      p.side="R";p.opponentName=opponent.name||"Участник";p.opponentImg=opponent.dataUrl||"";
      p.openingOpponentPhotoId=opponent.id;
      opponent.status="matched";opponent.targetLaneId=lane.id;opponent.matchedAt=now;opponent.matchDeadline=p.matchDeadline;
      opponent.openingPairPrimaryId=p.id;opponent.side="B";opponent.opponentName=p.name||profile.name||"Участник";opponent.opponentImg=p.dataUrl||"";
    }else if(lane.championPhotoId){
      p.opponentName=lane.championName||"Чемпион";p.opponentImg=lane.championImg||face(1,"B");
      p.side=lane.championSide==="R"?"B":"R";
    }else{
      p.status="queued";p.targetLaneId=null;p.matchedAt=null;p.matchDeadline=null;p._confirming=false;break;
    }
    p._confirming=false;
    window.FaceArenaAudio?.play("matchFound");
  }
}
function tickArena(){
  const now=arenaNow();
  if(window.FaceArenaSync?.isOnline()){
    if(arenaBattles.some(b=>b.stage==="m"&&b.confirmUntil&&b.confirmUntil<=now)&&!window._faConfirmRefresh){
      window._faConfirmRefresh=true;
      window.FaceArenaSync.loadSnapshot().finally(()=>{window._faConfirmRefresh=false});
    }
    if(!$("av").hidden){
      document.querySelectorAll(".card[data-id]").forEach(card=>{
        const b=arenaBattles.find(x=>x.id===+card.dataset.id);
        if(!b||(b.stage!=="m"&&b.stage!=="w"&&b.stage!=="v"))return;
        const left=Math.max(0,Math.ceil((b.stageEnd-now)/1000));
        const cd=card.querySelector(".cd");if(cd)cd.textContent=fmt(left);
        const bar=card.querySelector(".tl u");if(bar)bar.style.transform=`scaleX(${Math.min(1,left/STAGE_SEC)})`;
      });
    }
    return;
  }
  let changed=false;
  arenaBattles.forEach(b=>{
    if(b.stage!=="w"&&b.stage!=="v")return;
    if(b.stageEnd>now)return;
    if(finishBattle(b,now))changed=true;
  });
  photos.forEach(p=>{
    if(p.status==="matched"&&p.matchDeadline&&p.matchDeadline<=now&&!p._confirming){
      confirmMatch(p);changed=true;
    }
  });
  // Live update countdown labels on arena grid (without full re-render)
  if(!$("av").hidden){
    document.querySelectorAll(".card[data-id]").forEach(card=>{
      const id=+card.dataset.id;
      const b=arenaBattles.find(x=>x.id===id);
      if(!b||(b.stage!=="w"&&b.stage!=="v"))return;
      const left=Math.max(0,Math.ceil((b.stageEnd-now)/1000));
      const cd=card.querySelector(".cd");
      if(cd)cd.textContent=fmt(left);
      const bar=card.querySelector(".tl u");
      if(bar)bar.style.transform=`scaleX(${Math.min(1,left/STAGE_SEC)})`;
    });
  }
  if(changed){
    tryFillSlots();
    saveState();

function requestBattleVisit(b){
  const sync=window.FaceArenaSync;
  if(!sync?.isOnline?.()||!b||b.isParticipant||!b.battleUid||b._visitRequested||Date.now()<(b._visitRetryAt||0))return;
  b._visitRequested=true;
  sync.registerVisit(b.battleUid).then(result=>{
    if(result?.ok===false)toast("Голосование открыто, но серверный таймер временно недоступен");
    const latest=arenaBattles.find(x=>x.id===b.id);
    if(latest&&(latest.stage==="m"||latest.stage==="w")){
      latest._visitRequested=false;
      latest._visitRetryAt=Date.now()+3000;
    }
  }).catch(error=>{
    b._visitRequested=false;
    b._visitRetryAt=Date.now()+3000;
    if(location.hash==="#battle-"+b.id)toast(window.FaceArenaErrors.message(error,"Не удалось открыть голосование. Попробуйте ещё раз."));
  });
}

async function submit(n){
  if(busy)return;
  const v=$("ct").value.trim();
  if(!v){$("er").textContent=t("e0");return}
  if(v.length<10){$("er").textContent=t("e1");return}

    busy=false;toast(t("closed"));closeV();return;
  }
  if(window.FaceArenaSync?.isOnline()){
    const targetPhotoId=side==="R"?b2.redPhotoId:b2.bluePhotoId;

      busy=false;closeV();window.FaceArenaAudio?.play("voteSuccess");

}

const _viewHtmlCache=new WeakMap();
function setViewHTML(view,html){
  if(!view)return false;
  const source=String(html);
  const normalize=markup=>{
    const template=document.createElement("template");
    template.innerHTML=String(markup);
    template.content.querySelectorAll("img[data-photo-path]").forEach(img=>{
      img.setAttribute("src","__FA_SIGNED_PHOTO_URL__");
    });
    return template.innerHTML;
  };
  const desired=normalize(source);
  const current=normalize(view.innerHTML);
  const cached=_viewHtmlCache.get(view);
  // Skip only when both requested markup and live DOM match the last render.
  // If iOS or another route cleared/mutated the view, rebuild it.
  if(desired.trim()!==""&&desired===cached&&current===cached)return false;
  view.innerHTML=source;
  _viewHtmlCache.set(view,normalize(view.innerHTML));
  return true;
}

function startMatch(photoId){
  const p=photos.find(x=>String(x.id)===String(photoId));
  if(!p||p.status!=="queued"){toast("Фото не в очереди");return}
  tryFillSlots();
  if(p.status==="matched"){saveState();location.hash="match-"+encodeURIComponent(p.id);return}
  toast("Нет свободной линии. Фото останется в FIFO-очереди.");
  saveState();
}

function renderMatch(photoId){
  const p=photos.find(x=>String(x.id)===String(photoId));
  if(!p||p.status!=="matched"){location.hash="queue";return}
  // Deadline-based remaining time (does not restart on re-entry)
  if(!p.matchDeadline)p.matchDeadline=Date.now()+MATCH_SEC*1000;
  const left=Math.max(0,Math.ceil((p.matchDeadline-Date.now())/1000));
  if(left<=0){confirmMatch(p);return}
  $("mv").innerHTML=`

<div class="match-card">

    clearInterval(matchTimerId);
    const paired=p.openingOpponentPhotoId?photos.find(x=>String(x.id)===String(p.openingOpponentPhotoId)):null;
    if(paired){paired.status="queued";paired.battleId=null;paired.battleUid=null;paired.targetLaneId=null;paired.matchedAt=null;paired.matchDeadline=null;paired.side=null;paired.opponentName=null;paired.opponentImg=null;paired.openingPairPrimaryId=null;}
    p.status="queued";p.matchedAt=null;p.matchDeadline=null;p.targetLaneId=null;p.opponentName=null;p.opponentImg=null;p.side=null;p.openingOpponentPhotoId=null;p._confirming=false;
    toast(t("matchCancelOk"));saveState();location.hash="queue";
  };

    if(p.status!=="matched"){clearInterval(matchTimerId);return}

    const el=$("mcd");if(el)el.textContent=l;
    if(l<=0){clearInterval(matchTimerId);confirmMatch(p)}

function findFreeSlot(photo){
  if(photo&&photo.targetLaneId){

    if(target&&!target.userPhotoId&&(target.stage==="done"||target.stage==="cancelled"||target.stage==="empty"))return target;

function clearSlot(slot, preserveChampion){

    championStreak:slot.championStreak,
    championName:slot.championName,
    championImg:slot.championImg
  };
  slot.userPhotoId=null;
  slot.openingOpponentPhotoId=null;slot.openingOpponentName=null;slot.openingOpponentImg=null;
  slot.battleUid=null;
  slot.isMock=false;
  slot.redVotes=0;slot.blueVotes=0;
  slot.redName="—";slot.blueName="—";
  slot.stage="empty";
  slot.stageEnd=0;slot.stageStarted=0;
  slot._finalized=false;
  if(preserveChampion&&champ.championPhotoId){
    Object.assign(slot, champ);
  } else if(!preserveChampion){
    slot.championPhotoId=null;slot.championSide=null;slot.championStreak=0;slot.championName=null;slot.championImg=null;
  }
}
function confirmMatch(p){
  if(!p||p.status!=="matched")return;
  if(p._confirming)return; // prevent duplicate
  p._confirming=true;
  clearInterval(matchTimerId);
  const slot=findFreeSlot(p);
  if(!slot){
    p.status="queued";
    p.matchedAt=null;p.matchDeadline=null;p.targetLaneId=null;
    p.opponentName=null;p.opponentImg=null;p.side=null;
    p._confirming=false;
    toast("Нет свободных слотов на арене. Фото вернулось в очередь.");
    saveState();
    location.hash="queue";
    return;
  }
  const keepChamp=!!slot.championPhotoId;
  const openingOpponent=p.openingOpponentPhotoId?photos.find(x=>String(x.id)===String(p.openingOpponentPhotoId)):null;
  if(p.openingOpponentPhotoId&&!openingOpponent){
    p.status="queued";p.targetLaneId=null;p.matchDeadline=null;p.matchedAt=null;p.openingOpponentPhotoId=null;p._confirming=false;saveState();return;
  }
  clearSlot(slot, keepChamp);
  const uid=newBattleUid();
  p.status="confirmed";
  p.battleId=slot.id; // slot number for navigation
  p.targetLaneId=null;
  p.battleUid=uid;    // immutable instance id
  p.matchDeadline=null;
  p._confirming=false;
  slot.isMock=false;
  slot.userPhotoId=p.id;
  slot.battleUid=uid;
  if(openingOpponent){
    slot.openingOpponentPhotoId=openingOpponent.id;
    slot.openingOpponentName=openingOpponent.name||"Участник";
    slot.openingOpponentImg=openingOpponent.dataUrl||"";
    openingOpponent.status="confirmed";openingOpponent.battleId=slot.id;openingOpponent.battleUid=uid;
    openingOpponent.targetLaneId=null;openingOpponent.matchDeadline=null;openingOpponent.matchedAt=Date.now();
    openingOpponent.side="B";openingOpponent.openingPairPrimaryId=null;
  }
  slot.stage="w";
  slot.stageEnd=Date.now()+STAGE_SEC*1000;
  slot.stageStarted=Date.now();
  slot.redVotes=0;slot.blueVotes=0;
  slot._finalized=false;
  // If lane has champion, challenger is opposite side
  if(openingOpponent){
    p.side="R";p.opponentName=openingOpponent.name||"Участник";p.opponentImg=openingOpponent.dataUrl||"";
    slot.redName=profile.name||"Участник";slot.blueName=openingOpponent.name||"Участник";
  }else if(slot.championPhotoId&&String(slot.championPhotoId)!==String(p.id)){
    p.side=slot.championSide==="R"?"B":"R";
    p.opponentName=slot.championName||p.opponentName;
    p.opponentImg=slot.championImg||p.opponentImg;
  }
  if(p.side==="R"){slot.redName="you";slot.blueName=(p.opponentName||"opp").replace("@","")}
  else{slot.blueName="you";slot.redName=(p.opponentName||"opp").replace("@","")}
  // Self-challenge guard
  if(slot.championPhotoId&&String(slot.championPhotoId)===String(p.id)){
    p.status="queued";p.battleId=null;p._confirming=false;
    toast("Нельзя бросить вызов самому себе");
    saveState();location.hash="queue";return;
  }
  toast(t("matchConfirm"));
  window.FaceArenaAudio?.play("impact");
  saveState();
  renderArenaGrid();
  if(location.hash==="#match-"+encodeURIComponent(p.id))location.hash="queue";
}

function handleFile(f){
  if(!f)return;
  if(!["image/jpeg","image/png","image/webp"].includes(f.type)){toast(t("upBadType"));pendingUrl=null;pendingFile=null;renderUpload();return}
  if(f.size>MAX_SIZE){toast(t("upBadSize"));pendingUrl=null;pendingFile=null;renderUpload();return}
  const reader=new FileReader();
  reader.onerror=()=>{toast("Ошибка чтения файла");pendingUrl=null;pendingFile=null;renderUpload()};
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      try{
        if(!img.width||!img.height){toast("Некорректное изображение");return}
        const maxW=900;
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW}
        const c=document.createElement("canvas");c.width=w;c.height=h;
        const ctx=c.getContext("2d");
        if(!ctx){pendingUrl=e.target.result;pendingFile=f;renderUpload();return}
        ctx.drawImage(img,0,0,w,h);
        c.toBlob(blob=>{
          if(!blob){pendingUrl=e.target.result;pendingFile=f;renderUpload();return}
          pendingUrl=c.toDataURL("image/jpeg",0.82);
          const base=(f.name||"photo").replace(/\\.[^.]+$/,"");
          pendingFile=new File([blob],base+".jpg",{type:"image/jpeg",lastModified:Date.now()});
          renderUpload();
        },"image/jpeg",0.82);
      }catch(err){
        toast("Не удалось обработать изображение");
        pendingUrl=null;pendingFile=null;renderUpload();
      }
    };
    img.onerror=()=>{toast("Не удалось загрузить изображение");pendingUrl=null;pendingFile=null;renderUpload()};
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}
async function confirmAdd(){
  if(isPublishingPhoto)return;
  if(!pendingUrl){toast(t("upNoFile"));return}
  if(activeCount()>=MAX_ACTIVE){toast(t("upLimit"));return}
  isPublishingPhoto=true;
  const addButton=$("addBtn");
  if(addButton){
    addButton.disabled=true;
    addButton.classList.add("is-loading");
    addButton.setAttribute("aria-busy","true");
    addButton.textContent="Публикуем…";
  }
  if(window.FaceArenaSync?.isOnline()){
    try{
      const result=await window.FaceArenaSync.uploadPhoto(pendingFile);
      pendingFile=null;pendingUrl=null;
      if(result?.moderation==="review"){
        toast("Фото отправлено администратору на проверку. После одобрения оно появится в очереди.");
        isPublishingPhoto=false;
        location.hash="upload";
      }else{
        toast(result?.coordinatorAvailable===false?"Фото сохранено. Серверный таймер временно недоступен.":"Фото прошло проверку и добавлено в общую очередь");
        isPublishingPhoto=false;
        location.hash="queue";
      }
    }catch(error){
      isPublishingPhoto=false;
      toast(window.FaceArenaErrors.message(error,"Не удалось загрузить фотографию. Попробуйте ещё раз."));
      renderUpload();
    }
    return;
  }
  const id=Date.now()+"_"+Math.random().toString(36).slice(2,8);
  photos.push({id,dataUrl:pendingUrl,status:"queued",queuedAt:Date.now(),queueSeq:photos.reduce((m,x)=>Math.max(m,Number.isFinite(x.queueSeq)?x.queueSeq:-1),-1)+1});
  tryFillSlots();
  pendingFile=null;pendingUrl=null;
  toast(t("upOk")+" → смотрите во вкладке «Очередь»");
  try{saveState()}catch(e){toast("Фото добавлено, но сохранение не удалось");}
  updateArenaStats();
  location.hash="queue";
  isPublishingPhoto=false;
}

      <h2 class="sec-h" style="margin-top:4px">О нас</h2>
      <p class="set-info"><strong>FACE ARENA</strong> — платформа соревновательных фотобаттлов.</p>
      <p class="set-info">Участники выходят на арену в парных поединках, а сообщество голосует и оставляет комментарии. Победитель продолжает борьбу и защищает титул.</p>
      <p class="set-info">Результаты боёв, достижения и история участия сохраняются в профиле.</p>
      <a href="https://t.me/Facearenan" target="_blank" rel="noopener noreferrer" aria-label="Открыть Telegram-канал FACE ARENA" style="display:flex;align-items:center;gap:13px;margin-top:18px;padding:14px;border:1px solid transparent;border-radius:14px;background:transparent;color:#fff;text-decoration:none">
        <span aria-hidden="true" style="width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:50%;background:#229ED9">
          <svg viewBox="0 0 24 24" width="23" height="23" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20.66 4.35 17.6 19.1c-.23 1.04-.84 1.3-1.7.8l-4.7-3.46-2.27 2.18c-.25.25-.46.46-.94.46l.34-4.78 8.7-7.86c.38-.34-.08-.53-.58-.19L5.7 13.15l-4.63-1.45c-1-.31-1.02-1 .21-1.48L19.4 3.16c.86-.31 1.61.2 1.26 1.19Z" fill="white"/></svg>
        </span>
        <span style="display:block;min-width:0">
          <strong style="display:block;font-size:14px;line-height:1.35">Telegram — FACE ARENA</strong>
          <span style="display:block;margin-top:3px;color:var(--mu);font-size:12px;line-height:1.45">Новости, обновления и важные события арены. Подписывайся на наш официальный канал.</span>
          <span style="display:block;margin-top:6px;color:#39aeea;font-size:12px;font-weight:700">Перейти в Telegram ↗</span>
        </span>
      </a>

  `;

  const showSub=(id)=>{
    $("setMain").style.display="none";
    ["setSubProfile","setSubAnim","setSubSound","setSubNotifications","setSubPrivacy","setSubData","setSubAbout"].forEach(k=>{
      const el=$(k);if(el)el.classList.toggle("on",k===id);
    });
  };
  const showMain=()=>{
    $("setMain").style.display="";
    ["setSubProfile","setSubAnim","setSubSound","setSubNotifications","setSubPrivacy","setSubData","setSubAbout"].forEach(k=>{
      const el=$(k);if(el)el.classList.remove("on");
    });
  };

  $("sv").querySelectorAll("[data-go]").forEach(btn=>{
    btn.onclick=()=>{
      const go=btn.dataset.go;
      if(go==="profile")showSub("setSubProfile");
      else if(go==="appearance")showSub("setSubAnim");
      else if(go==="sound")showSub("setSubSound");
      else if(go==="notifications")showSub("setSubNotifications");
      else if(go==="privacy")showSub("setSubPrivacy");
      else if(go==="data")showSub("setSubData");
      else if(go==="about")showSub("setSubAbout");
      else if(go==="signout")window.FaceArenaSync?.signOut();
    };
  });

  ["backFromProfile","backFromAnim","backFromSound","backFromNotifications","backFromPrivacy","backFromData","backFromAbout"].forEach(id=>{
    const el=$(id);if(el)el.onclick=showMain;
  });

  const closeSettings=()=>{location.hash=""};
  const cx=$("setCloseX");if(cx)cx.onclick=closeSettings;
  const ex=$("setExit");if(ex)ex.onclick=closeSettings;

  const resetBtn=$("setResetBtn");
  if(resetBtn)resetBtn.onclick=resetData;

  const audio=window.FaceArenaAudio;
  if(audio){
    const togSound=$("togSound"),soundVolume=$("soundVolume"),soundValue=$("soundVolumeValue"),soundPreview=$("soundPreview");
    const syncSound=()=>{
      const current=audio.getSettings();
      if(togSound){
        togSound.classList.toggle("on",!!current.enabled);
        togSound.setAttribute("aria-pressed",String(!!current.enabled));
        togSound.dataset.enabled=String(!!current.enabled);
      }
      if(soundVolume)soundVolume.value=String(current.volume);
      if(soundValue)soundValue.textContent=current.volume+"%";
    };
    syncSound();
    if(togSound){
      togSound.addEventListener("click",()=>{
        const next=!audio.getSettings().enabled;
        try{
          const result=audio.setEnabled(next);
          syncSound();
          // Audio permission can fail independently; the user's preference remains saved.
          Promise.resolve(result).catch(()=>{}).finally(syncSound);
        }catch(error){
          syncSound();
          toast("Не удалось изменить настройку звука");
        }
      });
    }
    const updateSoundVolume=(event)=>{
      const target=event.target;
      if(!target||target.id!=="soundVolume")return;
      const value=Number(target.value);
      if(soundValue)soundValue.textContent=value+"%";
      try{audio.setVolume(value);}catch(error){console.error("FACE ARENA: volume update failed",error);}
    };
    // Delegation survives settings-panel re-renders and works with iOS range input.
    document.addEventListener("input",updateSoundVolume);
    document.addEventListener("change",updateSoundVolume);
    if(soundPreview)soundPreview.onclick=()=>{
      soundPreview.disabled=true;
      const originalLabel="Прослушать";
      audio.preview().then(ok=>{
        soundPreview.disabled=false;
        soundPreview.textContent=ok?originalLabel:"Звук недоступен";
        if(!ok)setTimeout(()=>{soundPreview.textContent=originalLabel;},1800);
      }).catch(()=>{
        soundPreview.disabled=false;
        soundPreview.textContent="Звук недоступен";
        setTimeout(()=>{soundPreview.textContent=originalLabel;},1800);
      });
    };
  }

  const ta=$("togAnim");
  if(ta)ta.onclick=()=>{
    prefAnim=!prefAnim;
    applyAnimPref();
    try{localStorage.setItem(ANIM_PREF_KEY,String(prefAnim))}catch(error){console.warn("[FACE ARENA animation preference]",error)}
    saveState();
    ta.classList.toggle("on",prefAnim);
    ta.setAttribute("aria-pressed",String(prefAnim));
    toast(prefAnim?"Анимации включены":"Анимации отключены");
  };

  let pushIsSubscribed=false;
  const pushButton=$("pushNotificationsButton");
  const pushStatus=$("pushNotificationStatus");
  const refreshPushControl=async()=>{
    if(!pushButton||!pushStatus)return;
    const sync=window.FaceArenaSync;
    if(!sync?.isOnline?.()){
      pushStatus.textContent="Войдите в аккаунт, чтобы включить Push.";
      pushButton.disabled=true;
      return;
    }
    try{
      const status=await sync.getPushStatus();
      pushIsSubscribed=!!status.subscribed;
      pushButton.textContent=pushIsSubscribed?"Отключить":"Включить";
      pushButton.disabled=!status.supported;
      pushStatus.textContent=!status.supported
        ?"Этот браузер не поддерживает Push-уведомления."
        :pushIsSubscribed
          ?"Push включены на этом устройстве."
          :status.permission==="denied"
            ?"Разрешение запрещено в настройках браузера."
            :"Push отключены на этом устройстве.";
    }catch(error){
      pushStatus.textContent="Не удалось проверить состояние Push.";
      pushButton.disabled=false;
    }
  };
  if(pushButton)pushButton.onclick=async()=>{
    const sync=window.FaceArenaSync;
    if(!sync?.isOnline?.()){toast("Сначала войдите в аккаунт");return;}
    pushButton.disabled=true;
    try{
      if(pushIsSubscribed){
        await sync.disablePush();
        toast("Push отключены на этом устройстве");
      }else{
        await sync.enablePush();
        toast("Push-уведомления включены");
      }
      await refreshPushControl();
    }catch(error){
      toast(window.FaceArenaErrors.message(error,"Не удалось настроить Push-уведомления."));
      await refreshPushControl();
    }finally{
      pushButton.disabled=false;
    }
  };
  refreshPushControl();
  window.addEventListener("face-arena-authenticated-boot-start",refreshPushControl);
  window.addEventListener("face-arena-snapshot",refreshPushControl);

  const privacyKeys=[
    ["privacyProfileToggle","profile_public"],
    ["privacyHistoryToggle","history_public"],
    ["privacySecurityToggle","security_notifications"],
    ["battleNotificationsToggle","battle_notifications"]
  ];
  const privacyOptimistic={};
  const privacyConfirmed={};
  const privacyWrites=new Map();
  const privacyVersions=new Map();
  let privacyOwnerId=null;
  const syncPrivacy=()=>{
    const sync=window.FaceArenaSync;
    const userId=sync?.getUser?.()?.id||null;
    if(privacyOwnerId!==userId){
      privacyOwnerId=userId;
      for(const [,key] of privacyKeys){
        delete privacyOptimistic[key];
        delete privacyConfirmed[key];
        privacyWrites.delete(key);
        privacyVersions.delete(key);
      }
    }
    const online=!!sync?.isOnline?.();
    const settings=sync?.lastSnapshot?.settings||{};
    for(const [id,key] of privacyKeys){
      const el=$(id);if(!el)continue;
      const serverValue=settings[key]!==false;
      if(!Object.prototype.hasOwnProperty.call(privacyOptimistic,key)&&!privacyWrites.has(key))privacyConfirmed[key]=serverValue;
      else if(!Object.prototype.hasOwnProperty.call(privacyConfirmed,key))privacyConfirmed[key]=serverValue;
      const value=Object.prototype.hasOwnProperty.call(privacyOptimistic,key)?privacyOptimistic[key]:serverValue;
      el.classList.toggle("on",value);
      el.setAttribute("aria-pressed",String(value));
      // Do not disable an authenticated toggle while its server write is pending.
      el.disabled=!online;
      el.setAttribute("aria-disabled",String(!online));
    }
  };
  // Settings may open before Supabase restores the session.
  if(window._faPrivacySnapshotHandler)window.removeEventListener("face-arena-snapshot",window._faPrivacySnapshotHandler);
  window._faPrivacySnapshotHandler=()=>syncPrivacy();
  window.addEventListener("face-arena-snapshot",window._faPrivacySnapshotHandler);
  syncPrivacy();
  for(const [id,key] of privacyKeys){
    const el=$(id);if(!el)continue;
    el.onclick=()=>{
      const sync=window.FaceArenaSync;
      if(!sync?.isOnline?.()){toast("Сначала войдите в аккаунт");return;}
      const userId=sync.getUser?.()?.id;
      if(!userId){toast("Сначала войдите в аккаунт");return;}
      const current=Object.prototype.hasOwnProperty.call(privacyOptimistic,key)
        ?privacyOptimistic[key]
        :(sync.lastSnapshot?.settings?.[key]!==false);
      const next=!current;
      const version=(privacyVersions.get(key)||0)+1;
      privacyVersions.set(key,version);
      privacyOptimistic[key]=next;
      el.classList.toggle("on",next);
      el.setAttribute("aria-pressed",String(next));
      // Queue writes per setting so rapid taps cannot arrive out of order.
      const previous=privacyWrites.get(key)||Promise.resolve();
      const write=previous.catch(()=>{}).then(()=>{
        if(sync.getUser?.()?.id!==userId)throw new Error("Аккаунт изменился. Повторите действие.");
        return sync.updatePrivacySettings({[key]:next});
      });
      privacyWrites.set(key,write);
      write.then(()=>{
        if(sync.getUser?.()?.id!==userId)return;
        privacyConfirmed[key]=next;
        if(privacyVersions.get(key)===version){
          delete privacyOptimistic[key];
          syncPrivacy();
          toast("Настройка сохранена");
        }
      }).catch(error=>{
        if(sync.getUser?.()?.id!==userId)return;
        if(privacyVersions.get(key)===version){
          privacyOptimistic[key]=privacyConfirmed[key]??(sync.lastSnapshot?.settings?.[key]!==false);
          syncPrivacy();
          delete privacyOptimistic[key];
          syncPrivacy();
          toast(window.FaceArenaErrors.message(error,"Не удалось сохранить настройку. Попробуйте ещё раз."));
        }
      }).finally(()=>{
        if(privacyWrites.get(key)===write)privacyWrites.delete(key);
      });
    };
  }
  const sessionInfo=$("currentSessionInfo");
  const sessionsList=$("activeSessionsList");
  const sessionDeviceLabel=ua=>/iPhone|iPad|iPod/.test(ua||"")?"Apple · iPhone/iPad":/Android/.test(ua||"")?"Android":/Macintosh|Mac OS/.test(ua||"")?"Mac":/Windows/.test(ua||"")?"Windows":/Linux/.test(ua||"")?"Linux":(ua||"Неизвестное устройство").slice(0,72);
  const loadActiveSessions=async()=>{
    if(!sessionsList||!window.FaceArenaSync?.isOnline?.())return;
    sessionsList.textContent="Загрузка…";
    try{
      const sessions=await window.FaceArenaSync.listSessions();
      if(!sessions.length){sessionsList.textContent="Активные сеансы не найдены";return;}
      sessionsList.innerHTML=sessions.map(session=>{
        const last=session.refreshed_at||session.created_at;
        const when=last?new Date(last).toLocaleString():"";
        const current=!!session.is_current;
        return '<div style="padding:10px 11px;background:#101010;border-radius:10px;display:flex;justify-content:space-between;gap:10px;align-items:center"><span style="min-width:0"><strong style="display:block;font-size:12px">'+esc(sessionDeviceLabel(session.user_agent))+'</strong><span style="display:block;color:var(--mu);font-size:10px;margin-top:3px">'+esc(when)+'</span></span><span style="flex:none;color:'+(current?'#fff':'var(--mu)')+';font-size:10px;font-weight:700">'+(current?'ТЕКУЩИЙ':'АКТИВЕН')+'</span></div>';
      }).join("");
      if(sessionInfo)sessionInfo.textContent="Сеансы этого аккаунта · список получен с сервера";
    }catch(error){
      sessionsList.textContent=window.FaceArenaErrors.message(error,"Не удалось загрузить список сеансов. Попробуйте позже.");
      if(sessionInfo)sessionInfo.textContent="Не удалось получить список сеансов";
    }
  };
  const openInbox=$("openNotificationsInbox");
  if(openInbox)openInbox.onclick=()=>{location.hash="notifications"};
  loadActiveSessions();
  const revokeBtn=$("revokeOtherSessions");
  if(revokeBtn)revokeBtn.onclick=async()=>{
    if(!confirm("Завершить все остальные сеансы FACE ARENA? Текущий сеанс останется активным."))return;
    revokeBtn.disabled=true;
    try{await window.FaceArenaSync.revokeOtherSessions();toast("Обновление токенов других сеансов отозвано");}
    catch(error){toast(window.FaceArenaErrors.message(error,"Не удалось завершить другие сеансы. Попробуйте позже."));}
    finally{revokeBtn.disabled=false;}
  };
  const deletionInfo=$("accountDeletionInfo");
  if(deletionInfo)deletionInfo.onclick=()=>toast("Удаление будет включено после безопасного переноса исторических результатов в обезличенный архив");

  const avatarInput=$("profileAvatarFile"),avatarChoose=$("chooseProfileAvatar"),avatarPreview=$("profileAvatarPreview");
  if(avatarChoose&&avatarInput)avatarChoose.onclick=()=>avatarInput.click();
  const prepareAvatarImage=file=>new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("Не удалось прочитать фотографию"));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("Файл не является корректной фотографией"));
      img.onload=()=>{
        if(!img.naturalWidth||!img.naturalHeight)return reject(new Error("Файл не является корректной фотографией"));
        const scale=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight));
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
        canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
        const ctx=canvas.getContext("2d");
        if(!ctx)return reject(new Error("Не удалось обработать фотографию"));
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        canvas.toBlob(blob=>{
          if(!blob)return reject(new Error("Не удалось обработать фотографию"));
          const base=(file.name||"avatar").replace(/\\.[^.]+$/,"");
          resolve(new File([blob],base+".jpg",{type:"image/jpeg",lastModified:Date.now()}));
        },"image/jpeg",0.88);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
  if(avatarInput)avatarInput.onchange=async()=>{
    const file=avatarInput.files?.[0];avatarInput.value="";
    if(!file)return;
    if(!window.FaceArenaSync?.isOnline?.()){toast("Войдите в аккаунт, чтобы добавить фото профиля");return}
    if(!["image/jpeg","image/png","image/webp"].includes(file.type)){toast("Можно загрузить только фотографию JPEG, PNG или WebP");return}
    if(file.size>5*1024*1024){toast("Размер фотографии не должен превышать 5 МБ");return}
    avatarChoose.disabled=true;avatarChoose.textContent="Проверяем фото…";
    try{
      const photo=await prepareAvatarImage(file);
      avatarChoose.textContent="Загружаем…";
      await window.FaceArenaSync.uploadProfileAvatar(photo);
      profile=window.FaceArenaSync.lastSnapshot?.profile||profile;
      if(avatarPreview){
        avatarPreview.dataset.photoPath=profile.avatarPath||"";
        avatarPreview.src=profile.avatarUrl||"";
        avatarPreview.hidden=!profile.avatarUrl;
      }
      toast("Фотография профиля обновлена");
      renderProfile();
    }catch(error){toast(window.FaceArenaErrors.message(error,"Не удалось загрузить фотографию профиля. Попробуйте ещё раз."))}
    finally{avatarChoose.disabled=false;avatarChoose.textContent=profile.avatarPath?"Изменить фото":"Добавить фото"}
  };

  const sp=$("saveProfile");
  if(sp)sp.onclick=async()=>{
    const name=($("setName").value||"").trim().slice(0,24);
    const handle=($("setHandle").value||"").trim().replace(/^@/,"").replace(/[^\w.]/g,"").slice(0,20);
    if(!name){toast("Укажите имя");return}
    if(!handle){toast("Укажите никнейм");return}
    if(window.FaceArenaSync?.isOnline()){
      try{await window.FaceArenaSync.updateProfile(name,handle)}catch(error){toast(window.FaceArenaErrors.message(error,"Не удалось сохранить профиль. Проверьте подключение и попробуйте снова."));return}
    }
    profile={...profile,name,handle};
    saveState();
    toast("Профиль сохранён");
    showMain();
  };
}

function renderNotifications(refresh=true){
  const host=$("nv");
  const sync=window.FaceArenaSync;
  const rows=sync?.notifications||[];
  const unread=rows.filter(row=>!row.read_at).length;
  const content=rows.length
    ? '<div class="notification-list">'+rows.map(row=>
      '<button type="button" class="notification-item '+(row.read_at?"read":"unread")+'" data-notification-id="'+esc(row.id)+'">'+
      '<span class="notification-dot" aria-hidden="true"></span><span><strong>'+esc(row.title)+'</strong><p>'+esc(row.body)+'</p><time>'+new Date(row.created_at).toLocaleString("ru")+'</time></span></button>').join("")+'</div>'
    : '<div class="empty-box"><p>Пока нет уведомлений. Здесь появятся сообщения о начале баттлов и их результатах.</p></div>';
  host.innerHTML=hdrHTML()+'<h1 class="sec-h">Уведомления</h1><p class="sec-lead">События твоих фотографий и чемпионских баттлов.</p>'+
    (unread?'<button type="button" class="menu-item" id="markAllNotificationsRead" style="padding:8px 0;color:#9bbcff">Отметить всё прочитанным</button>':"")+content;
  const markAll=$("markAllNotificationsRead");
  if(markAll)markAll.onclick=async()=>{
    markAll.disabled=true;
    try{await sync.markAllNotificationsRead();renderNotifications(false);}
    catch(error){markAll.disabled=false;toast(window.FaceArenaErrors.message(error,"Не удалось обновить уведомления."));}
  };
  host.querySelectorAll("[data-notification-id]").forEach(button=>{
    button.onclick=async()=>{
      const row=rows.find(item=>item.id===button.dataset.notificationId);
      if(!row)return;
      button.disabled=true;
      try{
        if(!row.read_at)await sync.markNotificationRead(row.id);
        const payload=row.payload||{};
        if(payload.result_id)location.hash="result-"+encodeURIComponent(payload.result_id);
        else if(payload.lane_id)location.hash="battle-"+Number(payload.lane_id);

    };
  });
  updateNotificationBadges();
  if(refresh&&sync?.isOnline?.())sync.refreshNotifications().catch(error=>console.warn("[FACE ARENA notifications]",error));
}

const _tabScrollPositions=new Map();
let _activeScrollKey=null;
function readPageScrollTop(){return $("appScroll").scrollTop}
function writePageScrollTop(top){$("appScroll").scrollTop=Math.max(0,Number(top)||0)}
const appScroll=$("appScroll");
if(appScroll)appScroll.addEventListener("scroll",()=>{
  if(_activeScrollKey&&scrollKeyForRoute(location.hash.slice(1))===_activeScrollKey){

  }
},{passive:true});
function saveActiveTabScroll(){if(_activeScrollKey)_tabScrollPositions.set(_activeScrollKey,readPageScrollTop())}
function restoreActiveTabScroll(){if(!_activeScrollKey)return;const saved=_tabScrollPositions.get(_activeScrollKey);if(Number.isFinite(saved))writePageScrollTop(saved)}
window.addEventListener("pagehide",saveActiveTabScroll);
window.addEventListener("pageshow",restoreActiveTabScroll);
document.addEventListener("visibilitychange",()=>{if(document.hidden)saveActiveTabScroll();else restoreActiveTabScroll()});
function scrollKeyForRoute(hash){
  if(hash===""||/^battle-\d+$/.test(hash))return "arena";
  if(hash==="queue"||hash.startsWith("match-"))return "queue";
  if(hash==="upload")return "upload";
  if(hash==="profile"||/^profile-[0-9a-f-]{36}$/i.test(hash))return "profile";
  if(hash==="results"||hash.startsWith("result-"))return "results";
  if(hash==="settings")return "settings";
  if(hash==="notifications")return "notifications";
  return hash||"arena";
}
function show(){
  if(_navLock)return;
  const hash=location.hash.slice(1)||"";
  const nextScrollKey=scrollKeyForRoute(hash);
  const previousScrollKey=_activeScrollKey;
  const changingScrollTab=previousScrollKey!==null&&previousScrollKey!==nextScrollKey;
  // The previous tab position is captured continuously by the scroll listener.
  // Do not read it here: iOS may already have applied the new hash scroll.
  const restoreScrollY=changingScrollTab?(_tabScrollPositions.get(nextScrollKey)||0):readPageScrollTop();
  // Supabase Google OAuth implicit-flow callback temporarily occupies the hash.
  // It is not an application route; let Supabase validate the tokens and restore
  // the session before the router decides which view to display.
  if(/^(?:access_token|refresh_token|token_type|expires_in|provider_token|error|error_description)=/.test(hash))return;
  closeV();
  // Match timer cleared inside renderMatch / when leaving match; avoid double-clear race
  const reduce=!prefAnim||document.documentElement.classList.contains("no-anim")||window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const current=Object.values(views).find(v=>v&&!v.hidden&&v.classList.contains("is-on"));
  const go=()=>{
    hideAll();
    let target=null;
    if(/^battle-(\d+)$/.test(hash)){
      const n=+RegExp.$1;
      if(n>=1&&n<=arenaBattles.length){bview(n);target=views.bv;setTab(0);tick2()}
    } else if(/^match-(.+)$/.test(hash)){
      renderMatch(decodeURIComponent(RegExp.$1));target=views.mv;setTab(1);
    } else if(/^result-(.+)$/.test(hash)){
      renderResult(decodeURIComponent(RegExp.$1));target=views.rv;setTab(3);
    } else if(hash==="queue"){renderQueue();target=views.qv;setTab(1)}
    else if(hash==="upload"){renderUpload();target=views.uv;setTab(2)}
    else if(/^profile-[0-9a-f-]{36}$/i.test(hash)){renderPublicProfile(decodeURIComponent(hash.slice(8)));target=views.pv;setTab(3)}
    else if(hash==="profile"){renderProfile();target=views.pv;setTab(3)}
    else if(hash==="results"){renderResults();target=views.iv;setTab(4)}
    else if(hash==="notifications"){renderNotifications();target=views.nv;setTab(3)}
    else if(hash==="settings"){renderSettings();target=views.sv;setTab(3)}
    else if(hash===""){renderArenaGrid();target=views.av;setTab(0)}
    else {renderNotFound();target=views.nfv;setTab(0)}
    if(target!==views.mv)clearInterval(matchTimerId);
    if(target)showView(target);
    // Hide bottom nav on settings (full-screen menu)
    const navEl=document.querySelector("nav");
    if(navEl)navEl.style.display=(hash==="settings"||target===views.nfv)?"none":"";
    bindGear();
    _activeScrollKey=nextScrollKey;
    if(changingScrollTab)writePageScrollTop(restoreScrollY);
    _navLock=false;
  };
  // Instant switch — CSS handles the short fade, no artificial delay
  go();
}

const faBootLoader=document.getElementById("fa-boot-loader");
const faBootCaption=document.getElementById("fa-boot-caption");
let faBootFinished=true,faBootStartedAt=0,faBootMinTimer=null,faBootFallbackTimer=null;
function startFaBoot(){
  if(!faBootLoader)return;
  if(faBootFallbackTimer)clearTimeout(faBootFallbackTimer);
  if(faBootMinTimer)clearTimeout(faBootMinTimer);
  faBootFinished=false;faBootStartedAt=Date.now();faBootMinTimer=null;
  faBootLoader.classList.remove("is-hidden");
  faBootLoader.classList.add("is-active");
  setFaBootProgress(0.08,"Загружаем арену");
  faBootFallbackTimer=setTimeout(()=>{
    if(!faBootFinished){setFaBootProgress(1,"Открываем арену");finishFaBoot();}
  },30000);
}
function hideFaBoot(){
  if(faBootFallbackTimer)clearTimeout(faBootFallbackTimer);
  if(faBootMinTimer)clearTimeout(faBootMinTimer);
  faBootFallbackTimer=null;faBootMinTimer=null;faBootFinished=true;
  faBootLoader?.classList.remove("is-active");
  faBootLoader?.classList.add("is-hidden");
}
function setFaBootProgress(progress,status){
  if(faBootFinished||!faBootLoader)return;
  const value=Math.max(0,Math.min(1,Number(progress)||0));
  faBootLoader.style.setProperty("--fa-progress",value.toFixed(3));
  if(status&&faBootCaption)faBootCaption.textContent=status;
}
window.addEventListener("face-arena-authenticated-boot-start",startFaBoot);
window.addEventListener("face-arena-authenticated-boot-stop",hideFaBoot);
window.addEventListener("face-arena-loader-progress",event=>{
  const detail=event.detail||{};
  setFaBootProgress(detail.progress,detail.status);
});
function finishFaBoot(){
  if(faBootFinished)return;
  const elapsed=Date.now()-faBootStartedAt;
  const wait=Math.max(0,1250-elapsed);
  if(faBootMinTimer)return;
  faBootMinTimer=setTimeout(()=>{
    if(faBootFinished)return;
    setFaBootProgress(1,"Арена готова");
    faBootFinished=true;
    setTimeout(()=>{
      faBootLoader?.classList.remove("is-active");
      faBootLoader?.classList.add("is-hidden");
    },260);
  },wait);
}
window.addEventListener("face-arena-sync-failed",finishFaBoot);

});

<script id="fa-push-onboarding-script">
(()=>{
  const overlay=document.getElementById("fa-push-onboarding");
  const enable=document.getElementById("fa-push-onboarding-enable");
  const later=document.getElementById("fa-push-onboarding-later");
  const loader=document.getElementById("fa-boot-loader");
  if(!overlay||!enable||!later)return;
  let checked=false,shown=false;
  const dismissedKey=userId=>"fa_push_prompt_dismissed_v1:"+userId;
  const dismiss=()=>{
    const userId=window.FaceArenaSync?.getUser?.()?.id;
    if(userId){try{localStorage.setItem(dismissedKey(userId),"1")}catch(_){}}
    overlay.classList.remove("is-visible");
  };
  later.addEventListener("click",dismiss);
  overlay.addEventListener("click",event=>{if(event.target===overlay)dismiss()});
  const maybeShow=async()=>{
    if(checked||shown)return;
    if(loader&&!loader.classList.contains("is-hidden"))return;
    const sync=window.FaceArenaSync;
    const user=sync?.getUser?.();
    if(!user?.id||!sync?.isOnline?.())return;
    checked=true;
    try{
      const status=await sync.getPushStatus();
      if(!status.supported||status.subscribed||status.permission!=="default")return;
      try{if(localStorage.getItem(dismissedKey(user.id))==="1")return}catch(_){}
      const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
      const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
      if(isIOS&&!standalone){
        document.getElementById("fa-push-onboarding-description").textContent="Сначала добавь FACE ARENA на экран «Домой» через меню «Поделиться», затем открой приложение с его значка и включи уведомления в настройках.";
        enable.textContent="Понятно";
        enable.onclick=dismiss;
      }else{
        enable.onclick=async()=>{
          enable.disabled=true;
          enable.textContent="Подключаем…";
          try{
            await sync.enablePush();
            overlay.classList.remove("is-visible");
            if(typeof toast==="function")toast("Push-уведомления включены");
          }catch(error){
            if(typeof toast==="function")toast(window.FaceArenaErrors?.message?.(error,"Не удалось включить уведомления.")||"Не удалось включить уведомления.");
            enable.disabled=false;
            enable.textContent="Повторить";
          }
        };
      }
      shown=true;
      overlay.classList.add("is-visible");
    }catch(_){checked=false;}
  };
  const observer=loader?new MutationObserver(()=>{
    if(loader.classList.contains("is-hidden"))setTimeout(maybeShow,450);
  }):null;
  if(observer)observer.observe(loader,{attributes:true,attributeFilter:["class"]});
  window.addEventListener("face-arena-authenticated-boot-stop",()=>setTimeout(maybeShow,450));
  window.addEventListener("face-arena-snapshot",()=>{if(!checked)setTimeout(maybeShow,450)});
  if(loader?.classList.contains("is-hidden"))setTimeout(maybeShow,700);
})();
</script>

    let message = "";
    if (paused && blocked) message = "Техническое обслуживание: баттлы остановлены, новые публикации временно недоступны. Ваши фотографии, профили и результаты завершённых матчей сохранены. Спасибо за понимание.";
    else if (paused) message = "Баттлы временно приостановлены. Незавершённые матчи отменены без победителя и без изменения рейтинга. Завершённые результаты и фотографии сохранены.";
    else message = "Новые публикации временно приостановлены. Уже загруженные фотографии, профиль и результаты доступны. Спасибо за понимание.";
    banner.textContent = message;
  }
  async function refresh() {
    try {
      const api = getClient();
      if (!api) return;
      const { data, error } = await api.rpc("get_arena_platform_controls");
      if (error) throw error;
      render((Array.isArray(data) ? data[0] : data) || {});
    } catch (error) {
      console.warn("[FACE ARENA maintenance status]", error);
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", refresh, { once: true });
  else refresh();
  setInterval(refresh, 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  window.addEventListener("face-arena-authenticated-boot-stop", refresh);
})();
</script>
</body>
</html>
